<text x="410" y="450" class="label">2147561061 · 150 mm · 18 AWG</text><text x="40" y="484" class="small">All six wires black: identify each by continuity, then label before soldering. Retain with cassette cable clamp.</text><text x="40" y="508" class="small">No raw cell taps. Do not connect under load. Unverified prototype interface; sample and assembly tests required.</text></svg>
