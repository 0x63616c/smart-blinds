name: Design checks

on:
  push:
    branches: [main]
    paths: ['firmware/**', 'integrations/**', 'cad/source/**', 'cad/parameters/**', 'cad/build*.py', 'cad/print_budget.py', 'hw/sim/blind-control/**', 'hw/schematics/**', 'hw/layouts/blind-controller/**', 'hw/parts/blind-core/**', 'hw/parts/blind-control-io/**', 'hw/boards/blind-io/**', 'hw/layouts/blind-io/**', 'hw/parts/blind-controller-common/**', 'hw/boards/blind-controller/**', 'hw/boards/blind-supervisor/**', 'hw/layouts/blind-supervisor/**', 'hw/parts/blind-supervisor/**', 'hw/boards/blind-assembly/**', 'hw/layouts/blind-assembly/**', 'hw/parts/blind-power/**', 'hw/boards/blind-charger/**', 'hw/layouts/blind-charger/**', 'hw/sim/blind-charge/**', 'hw/boards/blind-regulator/**', 'hw/layouts/blind-regulator/**', 'hw/parts/blind-regulator/**', 'hw/sim/blind-regulator/**', 'hw/sim/blind-power/**', 'hw/boards/blind-carrier/**', 'hw/layouts/blind-carrier/**', 'hw/parts/blind-carrier/**', 'hw/sim/blind-carrier/**', 'hw/boards/blind-usb/**', 'hw/layouts/blind-usb/**', 'hw/parts/blind-usb/**', 'hw/sim/blind-usb/**', 'hw/boards/blind-encoder/**', 'hw/layouts/blind-encoder/**', 'hw/parts/blind-encoder/**', 'hw/sim/blind-encoder/**', 'hw/boards/blind-regen/**', 'hw/layouts/blind-regen/**', 'hw/parts/blind-regen/**', 'hw/sim/blind-regen/**', 'hw/boards/blind-connectors/**', 'hw/parts/blind-connectors/**', 'hw/layouts/blind-connectors/**', 'hw/sim/blind-connectors/**', 'bom/**', 'hw/boards/blind-main/**', 'hw/layouts/blind-main/**', 'tools/verify_motor_build.py', 'tools/*schematic*.py', 'tools/kicad_sexpr.py', 'tools/rebuild_core_lands.py', 'tools/check_core_lands.py', 'docs/electrical/planning-profile.json', 'docs/measurements.json', '.github/workflows/design-checks.yml', 'hw/boards/blind-harness/**', 'hw/layouts/blind-harness/**', 'hw/parts/blind-harness/**', 'hw/sim/blind-harness/**', 'hw/boards/blind-pack-primary/**', 'hw/boards/blind-pack-companion/**', 'hw/layouts/blind-pack-primary/**', 'hw/layouts/blind-pack-companion/**', 'hw/parts/blind-pack-features/**', 'hw/parts/blind-holders/**', 'hw/sim/blind-pack/**', 'hw/placement/blind-main/**', 'tools/*placement*.py', 'tools/apply_harness_keepouts.py', 'hw/placement/blind-pack/**', 'hw/routing/**', 'tools/check_pack_frozen.py', 'tools/*courtyard*.py', 'tools/*clearances*.py', 'hw/placement/footprint-clearances.json', 'hw/parts/SAMSUNG_CL10A105KB8NNNC/**', 'hw/parts/UNI_ROYAL_0402WGF3903TCE/**', 'hw/parts/UNI_ROYAL_0603WAF1001T5E/**', 'tools/restore_pack_holes.py']
  pull_request:
    paths: ['firmware/**', 'integrations/**', 'cad/source/**', 'cad/parameters/**', 'cad/build*.py', 'cad/print_budget.py', 'hw/sim/blind-control/**', 'hw/schematics/**', 'hw/layouts/blind-controller/**', 'hw/parts/blind-core/**', 'hw/parts/blind-control-io/**', 'hw/boards/blind-io/**', 'hw/layouts/blind-io/**', 'hw/parts/blind-controller-common/**', 'hw/boards/blind-controller/**', 'hw/boards/blind-supervisor/**', 'hw/layouts/blind-supervisor/**', 'hw/parts/blind-supervisor/**', 'hw/boards/blind-assembly/**', 'hw/layouts/blind-assembly/**', 'hw/parts/blind-power/**', 'hw/boards/blind-charger/**', 'hw/layouts/blind-charger/**', 'hw/sim/blind-charge/**', 'hw/boards/blind-regulator/**', 'hw/layouts/blind-regulator/**', 'hw/parts/blind-regulator/**', 'hw/sim/blind-regulator/**', 'hw/sim/blind-power/**', 'hw/boards/blind-carrier/**', 'hw/layouts/blind-carrier/**', 'hw/parts/blind-carrier/**', 'hw/sim/blind-carrier/**', 'hw/boards/blind-usb/**', 'hw/layouts/blind-usb/**', 'hw/parts/blind-usb/**', 'hw/sim/blind-usb/**', 'hw/boards/blind-encoder/**', 'hw/layouts/blind-encoder/**', 'hw/parts/blind-encoder/**', 'hw/sim/blind-encoder/**', 'hw/boards/blind-regen/**', 'hw/layouts/blind-regen/**', 'hw/parts/blind-regen/**', 'hw/sim/blind-regen/**', 'hw/boards/blind-connectors/**', 'hw/parts/blind-connectors/**', 'hw/layouts/blind-connectors/**', 'hw/sim/blind-connectors/**', 'bom/**', 'hw/boards/blind-main/**', 'hw/layouts/blind-main/**', 'tools/verify_motor_build.py', 'tools/*schematic*.py', 'tools/kicad_sexpr.py', 'tools/rebuild_core_lands.py', 'tools/check_core_lands.py', 'docs/electrical/planning-profile.json', 'docs/measurements.json', '.github/workflows/design-checks.yml', 'hw/boards/blind-harness/**', 'hw/layouts/blind-harness/**', 'hw/parts/blind-harness/**', 'hw/sim/blind-harness/**', 'hw/boards/blind-pack-primary/**', 'hw/boards/blind-pack-companion/**', 'hw/layouts/blind-pack-primary/**', 'hw/layouts/blind-pack-companion/**', 'hw/parts/blind-pack-features/**', 'hw/parts/blind-holders/**', 'hw/sim/blind-pack/**', 'hw/placement/blind-main/**', 'tools/*placement*.py', 'tools/apply_harness_keepouts.py', 'hw/placement/blind-pack/**', 'hw/routing/**', 'tools/check_pack_frozen.py', 'tools/*courtyard*.py', 'tools/*clearances*.py', 'hw/placement/footprint-clearances.json', 'hw/parts/SAMSUNG_CL10A105KB8NNNC/**', 'hw/parts/UNI_ROYAL_0402WGF3903TCE/**', 'hw/parts/UNI_ROYAL_0603WAF1001T5E/**', 'tools/restore_pack_holes.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-and-parameters:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build portable motion controller
        run: |
          cmake -S firmware -B work/firmware-build
          cmake --build work/firmware-build
          ctest --test-dir work/firmware-build --output-on-failure
      - name: Test group coordinator
        run: python3 -m unittest discover -s integrations/home_assistant -p 'test_*.py'
      - name: Test authenticated simulator bridge
        run: python3 -m unittest discover -s integrations/bridge -p 'test_*.py' -v
      - name: Test gauge readback and offline profile calculations
        run: python3 -m unittest discover -s firmware/tools -p 'test_*.py'
      - name: Test bounded sleepy-radio wake policy
        run: |
          cmake -S firmware/radio -B work/radio-tests
          cmake --build work/radio-tests
          ctest --test-dir work/radio-tests --output-on-failure
      - name: Check CAD parameter consistency
        run: |
          python3 cad/build.py --check-parameters
          python3 cad/build_v2.py --check-parameters
          python3 cad/build_v2.py
          git diff --exit-code -- cad/generated/holder-verification.json cad/generated/holder-footprints.svg

  mechanical-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install geometry tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad xvfb xauth
      - name: Export and inspect provisional drive and compact fit parts
        run: |
          xvfb-run -a python3 cad/build_drive.py --export
          xvfb-run -a python3 cad/build_compact.py --export --intersections
      - uses: actions/upload-artifact@v4
        with:
          name: provisional-mechanical-fit-parts
          path: |
            cad/exports/drive-fit/
            cad/exports/compact-direct-fit/
            cad/generated/drive-verification.json
            cad/generated/compact-direct-verification.json
          if-no-files-found: error
          retention-days: 14

  retained-mechanical-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install geometry tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad xvfb xauth
      - name: Check retained case, cassette and service access
        run: xvfb-run -a python3 cad/build_retained.py --export --intersections --render
      - uses: actions/upload-artifact@v4
        with:
          name: retained-enclosure-fit-candidate
          path: |
            cad/exports/retained-compact-fit/
            cad/generated/retained-compact-verification.json
            cad/generated/retained-compact-*.png
          if-no-files-found: error
          retention-days: 14

  paired-battery-workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install geometry tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad xvfb xauth
      - name: Check paired holder loading, tray handling and the reusable fixture
        run: xvfb-run -a python3 cad/build_holder_pair_fixture.py --export --render --intersections --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: paired-battery-workshop-candidate
          path: |
            cad/exports/holder-pair-fixture/
            cad/generated/holder-pair-*.png
            cad/generated/holder-pair-fixture-verification.json
          if-no-files-found: error
          retention-days: 14

  mechanical-material-budget:
    needs: [mechanical-fit, retained-mechanical-fit, paired-battery-workshop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: provisional-mechanical-fit-parts
          path: cad
      - uses: actions/download-artifact@v4
        with:
          name: retained-enclosure-fit-candidate
          path: cad
      - uses: actions/download-artifact@v4
        with:
          name: paired-battery-workshop-candidate
          path: cad
      - name: Calculate material from the freshly verified print meshes
        run: python3 cad/print_budget.py --verify-stls
      - uses: actions/upload-artifact@v4
        with:
          name: mechanical-material-estimate
          path: |
            bom/mechanical-print-estimate.json
            bom/mechanical-print-volume.csv
            bom/mechanical-workshop-volume.csv
          if-no-files-found: error
          retention-days: 14

  thread-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native transport tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake git libssl-dev python3
      - name: Build pinned loopback transport evaluation
        run: |
          git clone --depth 1 --branch v4.3.5b https://github.com/obgm/libcoap.git work/libcoap-src
          cmake -S integrations/thread_transport -B work/thread-transport-build \
            -DLIBCOAP_SOURCE_DIR="$PWD/work/libcoap-src" \
            -DSB_BUILD_TEST_PEER=ON -DSB_ALLOW_CCM8_POLICY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build work/thread-transport-build -j 4
      - name: Exercise real DTLS sessions on IPv6 loopback
        run: |
          SB_THREAD_LIBRARY="$PWD/work/thread-transport-build/libsb_thread.so" \
            python3 -m unittest integrations.thread_transport.test_transport integrations.thread_transport.test_clock integrations.thread_transport.test_motion integrations.thread_bridge.test_bridge integrations.thread_bridge.test_group_dtls -v

  home-assistant:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned Home Assistant test framework
        run: python -m pip install -r integrations/home_assistant/ha_tests/requirements.txt
      - name: Exercise actual integration and loopback bridge
        run: python -m pytest -q integrations/home_assistant/ha_tests

  native-schematic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad xvfb xauth python3-wxgtk4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned circuit compiler
        run: python -m pip install atopile==0.15.9
      - name: Compile motor source and verify selected-part ratings
        run: python tools/verify_motor_build.py
      - name: Compile incomplete controller interface capture
        run: ato build hw/boards/blind-io -b controller-test --frozen -v
      - name: Compile and audit independent motor supervision capture
        run: |
          ato build hw/boards/blind-supervisor -b supervisor-test --frozen -v
          python hw/boards/blind-supervisor/check_supervisor.py
          python -m unittest discover -s hw/boards/blind-supervisor -p 'test_*.py' -v
      - name: Compile charger capture and verify selected-part ratings
        run: |
          ato build hw/boards/blind-charger -b charger-test --frozen -v
          python hw/sim/blind-charge/checks.py
          python hw/sim/blind-charge/check_connectivity.py --check
      - name: Compile logic supply and check effective capacitor estimates
        run: |
          ato build hw/boards/blind-regulator -b regulator-test --frozen -v
          python hw/sim/blind-regulator/checks.py --check
          python hw/sim/blind-power/check_capacitance.py --check
      - name: Compile and audit USB-C input study
        run: |
          ato build hw/boards/blind-usb -b usb-test --frozen -v
          python hw/sim/blind-usb/checks.py --check
      - name: Compile and audit switched encoder supply
        run: |
          ato build hw/boards/blind-encoder -b encoder-test --frozen -v
          python hw/sim/blind-encoder/checks.py --check
      - name: Compile and audit protected battery carrier study
        run: |
          ato build hw/boards/blind-carrier -b carrier-test --frozen -v
          python hw/sim/blind-carrier/checks.py --check
      - name: Compile and audit controller, supervisor and motor integration
        run: |
          ato build hw/boards/blind-assembly -b controller-test --frozen -v
          python hw/boards/blind-assembly/check_assembly.py
          python -m unittest discover -s hw/boards/blind-assembly -p 'test_*.py' -v
      - name: Compile and audit regenerative clamp capture
        run: |
          ato build hw/boards/blind-regen -b regen-test --frozen -v
          python hw/sim/blind-regen/checks.py --check
      - name: Compile and audit protected pack connector
        run: |
          ato build hw/boards/blind-connectors -b connector-test --frozen -v
          python hw/sim/blind-connectors/checks.py --check
      - name: Compile and audit holder-carrier and harness captures
        run: |
          python3 tools/check_pack_frozen.py --ato ato --output work/carrier-frozen.json
          python3 hw/placement/blind-pack/checks.py
          python3 hw/sim/blind-pack/checks.py --check
          ato build hw/boards/blind-harness -b harness-test --frozen -v
          python3 hw/sim/blind-harness/checks.py --check
      - name: Check experimental companion copper and injected failures
        run: |
          xvfb-run -a /usr/bin/python3 hw/routing/blind-pack-companion/checks.py --negative-tests
          python3 hw/routing/blind-pack-companion/estimate_losses.py
      - name: Check connected primary routing, Kelvin topology and solder-land clearances
        run: |
          xvfb-run -a /usr/bin/python3 hw/routing/blind-pack-primary/checks.py --negative-tests
          python3 hw/routing/blind-pack-primary/estimate_losses.py
      - name: Check partial main power routing and injected failures
        run: xvfb-run -a /usr/bin/python3 hw/routing/blind-main/checks.py --negative-tests
      - name: Check captured component prices and quantities
        run: python3 bom/captured_components.py --check
      - name: Compile and audit main-controller integration
        run: |
          ato build hw/boards/blind-main -b main-test --frozen -v
          python hw/boards/blind-main/check_main.py
          python hw/boards/blind-main/check_shared_power_bus.py
          git diff --exit-code -- hw/boards/blind-main/shared-power-bus-results.json
          python hw/sim/blind-usb/check_footprint.py
          python tools/check_core_lands.py
          python tools/check_main_placement.py
          python tools/complete_courtyards.py --check
          python tools/check_footprint_clearances.py --drc
          python -m unittest discover -s tools -p test_footprint_clearances.py -v
          python -m unittest discover -s tools -p test_placement_format.py -v
          python -m unittest discover -s hw/boards/blind-main -p 'test_*.py' -v
      - name: Verify schematic source, physical graph and documented ERC boundaries
        run: |
          python3 tools/generate_schematics.py hw/schematics/blind-controller/motor-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-supervisor/supervisor-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-charger/charger-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-regulator/regulator-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-carrier/carrier-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-usb/usb-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-regen/regen-test.layout.json --check
          python3 tools/generate_main_schematic.py --check
          python3 -m unittest discover -s tools -p test_schematic_graph.py -v
          python3 -m unittest discover -s tools -p test_main_schematic.py -v

  electrical-assumptions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install circuit simulator
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ngspice
      - name: Check the documented electrical assumptions
        run: |
          python3 -m unittest discover -s hw/sim/blind-control -p test_energy.py -v
          python3 hw/sim/blind-control/run_checks.py
          python3 hw/sim/blind-regen/run_spice.py
      - uses: actions/upload-artifact@v4
        with:
          name: electrical-envelope-results
          path: |
            hw/sim/blind-control/results/*.json
            hw/sim/blind-control/results/*.csv
          if-no-files-found: error

  embedded-bring-up:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build motor-disabled ESP32-C6 image
        run: |
          docker run --rm -v "$PWD:/project" -w /project/firmware/esp-idf \
            espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b \
            idf.py -B /project/work/c6-build set-target esp32c6 build
      - uses: actions/upload-artifact@v4
        with:
          name: motor-disabled-c6-bring-up
          path: |
            work/c6-build/*.bin
            work/c6-build/*.elf
            work/c6-build/*.map
            work/c6-build/flasher_args.json
            work/c6-build/bootloader/bootloader.bin
            work/c6-build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 14

  embedded-thread:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build motor-disabled C6 Thread and DTLS evaluation
        run: |
          docker run --rm -v "$PWD:/project" -w /project/firmware/esp-idf-thread \
            espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b \
            idf.py -B /project/work/c6-thread-build set-target esp32c6 build
      - uses: actions/upload-artifact@v4
        with:
          name: motor-disabled-c6-thread-evaluation
          path: |
            work/c6-thread-build/*.bin
            work/c6-thread-build/*.elf
            work/c6-thread-build/*.map
            work/c6-thread-build/flasher_args.json
            work/c6-thread-build/bootloader/bootloader.bin
            work/c6-thread-build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 14

  embedded-wifi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Wi-Fi evaluation dependencies
        run: sh firmware/esp-idf-wifi/fetch_dependencies.sh
      - name: Install native Wi-Fi transport tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev python3
      - name: Exercise the Wi-Fi policy over real loopback DTLS
        run: |
          cmake -S integrations/wifi_transport -B work/wifi-transport-build \
            -DLIBCOAP_SOURCE_DIR="$PWD/work/wifi-idf-extra/coap/libcoap" \
            -DSB_ALLOW_CCM8_POLICY=ON
          cmake --build work/wifi-transport-build -j 4
          SB_WIFI_LIBRARY="$PWD/work/wifi-transport-build/libsb_wifi.so" \
            python3 -m unittest integrations.wifi_transport.test_evaluation -v
      - name: Cross-build motor-disabled C6 Wi-Fi and DTLS evaluation
        run: |
          docker run --rm -v "$PWD:/project" -w /project/firmware/esp-idf-wifi \
            espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b \
            idf.py -D SB_COAP_DIR=/project/work/wifi-idf-extra/coap \
              -B /project/work/c6-wifi-build set-target esp32c6 build
      - name: Compile the isolated gauge attachment branch against the real C6 SDK
        run: |
          printf '%s\n' 'CONFIG_BLINDS_GAUGE_CONTINUITY_BENCH=y' > work/gauge-adapter-bench.defaults
          docker run --rm -v "$PWD:/project" -w /project/firmware/esp-idf-wifi \
            espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b \
            idf.py -D SB_COAP_DIR=/project/work/wifi-idf-extra/coap \
              -D SDKCONFIG=/project/work/c6-gauge-adapter-bench.sdkconfig \
              -D 'SDKCONFIG_DEFAULTS=/project/firmware/esp-idf-wifi/sdkconfig.defaults;/project/work/gauge-adapter-bench.defaults' \
              -B /project/work/c6-gauge-adapter-bench set-target esp32c6 build
      - uses: actions/upload-artifact@v4
        with:
          name: motor-disabled-c6-wifi-evaluation
          path: |
            work/c6-wifi-build/*.bin
            work/c6-wifi-build/*.elf
            work/c6-wifi-build/*.map
            work/c6-wifi-build/flasher_args.json
            work/c6-wifi-build/bootloader/bootloader.bin
            work/c6-wifi-build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 14

  embedded-wifi-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Wi-Fi dependencies
        run: sh firmware/esp-idf-wifi/fetch_dependencies.sh
      - name: Cross-build default-unqualified Wi-Fi motion target
        run: |
          docker run --rm -v "$PWD:/project" -w /project/firmware/esp-idf-wifi-motion \
            espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b \
            idf.py -D SB_COAP_DIR=/project/work/wifi-idf-extra/coap \
              -B /project/work/c6-wifi-motion-build set-target esp32c6 build
      - name: Compile the motion owner branch with empty physical records
        run: |
          docker run --rm -v "$PWD:/project" -w /project/firmware/esp-idf-wifi-motion \
            espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b \
            idf.py -D SB_COAP_DIR=/project/work/wifi-idf-extra/coap \
              -D SDKCONFIG=/project/work/c6-wifi-motion-bench.sdkconfig \
              -D 'SDKCONFIG_DEFAULTS=/project/firmware/esp-idf-wifi-motion/sdkconfig.defaults;/project/firmware/esp-idf-wifi-motion/bench-compile.defaults' \
              -B /project/work/c6-wifi-motion-bench set-target esp32c6 build
