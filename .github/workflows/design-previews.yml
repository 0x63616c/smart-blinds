name: Design previews

on:
  push:
    branches: [main]
    paths: ['hw/**', 'cad/**', 'tools/*.py', 'docs/previews.json', 'docs/electrical/planning-profile.json', 'docs/measurements.json', '.github/workflows/design-previews.yml']
  pull_request:
    paths: ['hw/**', 'cad/**', 'tools/*.py', 'docs/previews.json', 'docs/electrical/planning-profile.json', 'docs/measurements.json', '.github/workflows/design-previews.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test preview host boundary and source-aware publication
        run: python3 -m unittest discover -s tools -p 'test_*previews.py' -v
      - name: Install rendering tools
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad kicad-packages3d openscad xvfb xauth python3-matplotlib python3-wxgtk4.0 python3-shapely python3-venv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Recompile the live controller source before preview generation
        run: |
          python3 -m venv work/preview-compiler
          work/preview-compiler/bin/pip install atopile==0.15.9
          work/preview-compiler/bin/ato build hw/boards/blind-main -b main-test -v
          work/preview-compiler/bin/ato build hw/boards/blind-main -b main-test --frozen -v
      - name: Check CAD parameters
        run: |
          python3 cad/build.py --check-parameters
          python3 cad/build_v2.py --check-parameters
          python3 cad/enclosure-v2/prepare.py --check
          python3 tools/check_enclosure_board_binding.py --repo . --package cad/enclosure-v2 --source-only
      - name: Check generated native schematic
        run: |
          python3 tools/generate_schematics.py hw/schematics/blind-controller/motor-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-supervisor/supervisor-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-charger/charger-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-regulator/regulator-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-carrier/carrier-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-usb/usb-test.layout.json --check
          python3 tools/generate_schematics.py hw/schematics/blind-regen/regen-test.layout.json --check
          python3 tools/generate_main_schematic.py --check
      - name: Generate previews from sources
        run: xvfb-run -a /usr/bin/python3 tools/render_previews.py
      - name: Prepare review artifact
        run: |
          mkdir -p work/preview-artifact/docs
          cp README.md work/preview-artifact/
          cp -R docs/generated work/preview-artifact/docs/
      - uses: actions/upload-artifact@v4
        with:
          name: design-previews
          path: work/preview-artifact/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: design-previews
          path: work/preview-artifact
      - name: Publish only if design inputs are still current
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/publish_previews.py --artifact-dir work/preview-artifact --source-commit "$SOURCE_SHA" --publish
